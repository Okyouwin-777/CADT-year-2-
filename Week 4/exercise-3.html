<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: sans-serif;
        }

        .container {
            height: 100vh;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        header,
        main,
        aside,
        footer,
        .item {
            padding: 1rem;
            border-radius: 0.5rem;
            color: white;
            font-weight: bold;
            font-size: 0.875rem;
        }

        header,
        footer {
            display: flex;
            align-items: center;   
            height: 3rem;
            flex-shrink: 0;
            padding: 0 1rem;       
        }

        header {
            background-color: #1e90ff;
        }

        footer {
            background-color: #4169e1;
        }

        .middle {
            display: flex;
            flex-direction: row;
            flex-grow: 1;
            gap: 1rem;
        }

        main {
            background-color: #3cb371;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 1rem;            
        }

        main p {
            margin: 0;
        }

        aside {
            background-color: #ff6347;
            width: 300px;
            flex-shrink: 0;       
        }

        .items {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .item {
            background-color: #2f8d59;
            width: 200px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            header
        </header>
        <div class="middle">
            <main>
                <p>main</p>
                <div class="items">
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                </div>
            </main>
            <aside>
                sidebar
            </aside>
        </div>
        <footer>
            footer
        </footer>
    </div>
</body>
</html>
